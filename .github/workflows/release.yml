name: Release
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  deployments: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
        arch: [x64, arm64]
        exclude:
          - platform: macos-latest
            arch: x64
          - platform: macos-latest
            arch: arm64
          - platform: ubuntu-22.04
            arch: arm64
        include:
          - platform: macos-latest
            arch: universal
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust (Stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'windows-latest' && matrix.arch == 'arm64' && 'aarch64-pc-windows-msvc' || matrix.platform == 'macos-latest' && matrix.arch == 'universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "tauri-build-${{ matrix.platform }}-${{ matrix.arch || 'x64' }}"

      - name: Install Dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Read release notes from changelog
        if: startsWith(github.ref, 'refs/tags/')
        id: release_notes
        shell: bash
        run: |
          delimiter="CHANGELOG_$(node -p "require('node:crypto').randomUUID()")"
          {
            echo "body<<$delimiter"
            awk -v heading="## $GITHUB_REF_NAME" '
              { sub(/\r$/, "") }
              $0 == heading { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Windows ARM64 environment
        if: matrix.platform == 'windows-latest' && matrix.arch == 'arm64'
        run: |
          'RUSTFLAGS=-C target-feature=+crt-static' >> $env:GITHUB_ENV

      - name: Build the app (Standard x64)
        if: matrix.arch == 'x64'
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.sha) }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Beta {0}', github.ref_name) || format('Development Build ({0})', github.sha) }}
          releaseBody: ${{ startsWith(github.ref, 'refs/tags/') && (steps.release_notes.outputs.body || format('请查看 [CHANGELOG.md](https://github.com/{0}/blob/main/CHANGELOG.md) 了解更新内容。', github.repository)) || format('开发构建 - 提交信息：{0}', github.event.head_commit.message) }}
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          includeRelease: true
          includeUpdaterJson: true

      - name: Upload x64 artifacts
        if: matrix.arch == 'x64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-artifacts
          path: |
            src-tauri/gen/*/metadata.json
            src-tauri/target/**/release/*.msi
            src-tauri/target/**/release/*.exe
            src-tauri/target/**/release/bundle/deb/*.deb
            src-tauri/target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

      - name: Build the app (WINDOWS ARM64)
        if: matrix.arch == 'arm64' && matrix.platform == 'windows-latest'
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.sha) }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Beta {0}', github.ref_name) || format('Development Build ({0})', github.sha) }}
          releaseBody: ${{ startsWith(github.ref, 'refs/tags/') && (steps.release_notes.outputs.body || format('请查看 [CHANGELOG.md](https://github.com/{0}/blob/main/CHANGELOG.md) 了解更新内容。', github.repository)) || format('开发构建 - 提交信息：{0}', github.event.head_commit.message) }}
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          includeRelease: true
          includeUpdaterJson: true
          args: --target aarch64-pc-windows-msvc

      - name: Upload Windows ARM64 artifacts
        if: matrix.arch == 'arm64' && matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-artifacts
          path: |
            src-tauri/gen/aarch64-pc-windows-msvc/metadata.json
            src-tauri/target/aarch64-pc-windows-msvc/release/*.msi
            src-tauri/target/aarch64-pc-windows-msvc/release/*.exe
          if-no-files-found: warn

      - name: Import Apple Certificate
        if: matrix.platform == 'macos-latest'
        run: |
          echo "配置证书环境..."
          
          # 清理任何可能存在的旧keychain
          security delete-keychain build.keychain || true
          
          # 创建新的临时keychain
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security list-keychains -d user -s build.keychain login.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          
          # 设置keychain超时时间，确保在构建过程中不会锁定
          security set-keychain-settings -t 3600 -l build.keychain
    
          echo "导入证书..."
          echo "${{ secrets.CERTIFICATES_P12 }}" | base64 --decode > certificate.p12
          security import certificate.p12 \
            -k build.keychain \
            -P "${{ secrets.CERTIFICATES_P12_PASSWORD }}" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
    
          echo "设置keychain分区列表..."
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" \
            build.keychain
    
          echo "验证证书导入情况..."
          security find-identity -v build.keychain

      - name: Build the app (macOS universal)
        if: matrix.platform == 'macos-latest' && matrix.arch == 'universal'
        uses: tauri-apps/tauri-action@v0
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
          APPLE_SIGNING_IDENTITY: 'Developer ID Application: Caner (Chongqing) Computer System Co., Ltd. (89M33WN9W7)'
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('dev-{0}', github.sha) }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Beta {0}', github.ref_name) || format('Development Build ({0})', github.sha) }}
          releaseBody: ${{ startsWith(github.ref, 'refs/tags/') && (steps.release_notes.outputs.body || format('请查看 [CHANGELOG.md](https://github.com/{0}/blob/main/CHANGELOG.md) 了解更新内容。', github.repository)) || format('开发构建 - 提交信息：{0}', github.event.head_commit.message) }}
          releaseDraft: ${{ startsWith(github.ref, 'refs/tags/') }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          includeRelease: true
          includeUpdaterJson: true
          args: --target universal-apple-darwin

      - name: Upload macOS artifacts
        if: matrix.platform == 'macos-latest' && matrix.arch == 'universal'
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-artifacts
          path: |
            src-tauri/gen/universal-apple-darwin/metadata.json
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/*.dmg
            src-tauri/target/*.zip
          if-no-files-found: warn

      - name: Create and Sign DMG (macOS only)
        if: matrix.platform == 'macos-latest'
        id: create_dmg
        run: |
          echo "创建DMG包..."
          # 设置路径变量
          APP_PATH="${GITHUB_WORKSPACE}/src-tauri/target/universal-apple-darwin/release/bundle/macos/OpenFrp-CrossPlatformLauncher.app"
          DMG_PATH="${GITHUB_WORKSPACE}/src-tauri/target/OpenFrp-CrossPlatformLauncher.dmg"
          TEMP_DMG_PATH="${GITHUB_WORKSPACE}/src-tauri/target/temp.dmg"
          
          # 确保应用已签名
          echo "检查应用签名状态..."
          codesign --verify --deep --strict "${APP_PATH}"
          
          # 检查目标路径是否存在
          [ -d "${APP_PATH}" ] || { echo "应用不存在于路径: ${APP_PATH}"; exit 1; }
          
          # 清理可能存在的旧文件
          echo "清理可能存在的旧DMG文件..."
          rm -f "${DMG_PATH}" "${TEMP_DMG_PATH}"
          
          # 等待一会儿确保资源释放
          sleep 3
          
          # 创建DMG（含 Applications 快捷方式 + 背景引导图 + 图标布局）
          echo "创建DMG（含 Applications 快捷方式与安装引导）..."
          STAGING_DIR=$(mktemp -d)
          cp -R "${APP_PATH}" "${STAGING_DIR}/"
          ln -s /Applications "${STAGING_DIR}/Applications"

          # 生成背景引导图（箭头 + 提示文字）
          pip3 install Pillow --quiet 2>/dev/null || true
          mkdir -p "${STAGING_DIR}/.background"
          python3 -c "
          from PIL import Image, ImageDraw, ImageFont
          W, H = 660, 400
          img = Image.new('RGBA', (W, H), (255, 255, 255, 0))
          draw = ImageDraw.Draw(img)
          for y in range(H):
              r = int(114 + (255 - 114) * (y / H))
              g = int(160 + (255 - 160) * (y / H))
              b = int(201 + (255 - 201) * (y / H))
              draw.line([(0, y), (W, y)], fill=(r, g, b, 60))
          ay = 175; x1, x2 = 260, 400
          draw.line([(x1, ay), (x2, ay)], fill=(120, 120, 120, 200), width=4)
          draw.polygon([(x2+12, ay), (x2-8, ay-12), (x2-8, ay+12)], fill=(120, 120, 120, 200))
          try:
              font = ImageFont.truetype('/System/Library/Fonts/Helvetica.ttc', 18)
          except:
              font = ImageFont.load_default()
          text = 'Drag to Applications'
          bbox = draw.textbbox((0, 0), text, font=font)
          draw.text(((W - (bbox[2]-bbox[0])) // 2, 230), text, fill=(90, 90, 90, 220), font=font)
          img.save('${STAGING_DIR}/.background/background.png')
          " 2>/dev/null || echo "背景图生成失败，将跳过背景"

          # 创建可写 DMG，设置窗口布局后转为压缩只读
          if ! hdiutil create -volname "OpenFrp-CPL" -srcfolder "${STAGING_DIR}" -ov -format UDRW "${TEMP_DMG_PATH}"; then
            echo "创建DMG失败，尝试创建ZIP包作为备选..."
            ZIP_PATH="${GITHUB_WORKSPACE}/src-tauri/target/OpenFrp-CrossPlatformLauncher.zip"
            ditto -c -k --keepParent "${APP_PATH}" "${ZIP_PATH}"
            echo "zip_path=${ZIP_PATH}" >> $GITHUB_OUTPUT
            echo "dmg_path=" >> $GITHUB_OUTPUT
            rm -rf "${STAGING_DIR}"
            exit 0
          fi
          rm -rf "${STAGING_DIR}"

          # 挂载可写 DMG，用 AppleScript 设置图标位置、窗口大小和背景图
          MOUNT_DIR=$(hdiutil attach -readwrite -noverify -noautoopen "${TEMP_DMG_PATH}" | grep -o '/Volumes/.*$' | head -1)
          osascript << 'APPLESCRIPT' || echo "AppleScript 窗口设置失败，继续..."
          tell application "Finder"
            tell disk "OpenFrp-CPL"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set the bounds of container window to {0, 0, 660, 400}
              set theViewOptions to the icon view options of container window
              set arrangement of theViewOptions to not arranged
              set icon size of theViewOptions to 128
              try
                set background picture of theViewOptions to file ".background:background.png"
              end try
              set position of item "OpenFrp-CrossPlatformLauncher" of container window to {180, 170}
              set position of item "Applications" of container window to {480, 170}
              close
              open
              close
            end tell
          end tell
          APPLESCRIPT
          sleep 5
          hdiutil detach "${MOUNT_DIR}" || true

          # 转换为压缩只读 DMG
          hdiutil convert "${TEMP_DMG_PATH}" -format UDZO -o "${DMG_PATH}"
          rm -f "${TEMP_DMG_PATH}"
          
          codesign --sign "Developer ID Application: Caner (Chongqing) Computer System Co., Ltd. (89M33WN9W7)" \
            --keychain build.keychain --timestamp "${DMG_PATH}"
          codesign --verify --strict "${DMG_PATH}"
          echo "dmg_path=${DMG_PATH}" >> "$GITHUB_OUTPUT"

      - name: Notarize DMG (macOS only)
        if: matrix.platform == 'macos-latest' && steps.create_dmg.outputs.dmg_path != ''
        id: notarize_dmg
        env:
          DMG_PATH: ${{ steps.create_dmg.outputs.dmg_path }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcrun notarytool submit "$DMG_PATH" --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" \
            --wait --timeout 1200 --output-format json > "$RUNNER_TEMP/ofcpl-notary.json"
          jq -e '.status == "Accepted"' "$RUNNER_TEMP/ofcpl-notary.json"
          xcrun stapler staple "$DMG_PATH"
          xcrun stapler validate "$DMG_PATH"
          SIGNED_DMG_PATH="${DMG_PATH%.dmg}_signed.dmg"
          mv "$DMG_PATH" "$SIGNED_DMG_PATH"
          echo "path=$SIGNED_DMG_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload guided macOS installer
        if: matrix.platform == 'macos-latest' && startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED_DMG_PATH: ${{ steps.notarize_dmg.outputs.path }}
          ZIP_PATH: ${{ steps.create_dmg.outputs.zip_path }}
        run: |
          asset="${SIGNED_DMG_PATH:-$ZIP_PATH}"
          test -f "$asset"
          gh release upload "$GITHUB_REF_NAME" "$asset" --clobber

  process-updates:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display artifact structure
        run: find artifacts -type f | sort

      - name: Fix AppImage permissions
        run: |
          find artifacts -name "*.AppImage" -type f | while read -r file; do
            chmod +x "$file"
          done

      - name: Upload artifacts to release
        run: |
          echo "上传构建产物到GitHub Release..."
          
          # 创建存放文件的临时目录
          mkdir -p release_files
          
          # 复制所有二进制文件和签名文件
          find artifacts -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.zip" -o -name "*.sig" \) | while read -r file; do
            filename=$(basename "$file")
            if [[ "$filename" == openfrp_cpl.exe ]]; then
              case "$file" in
                artifacts/windows-arm64-artifacts/*) arch=arm64 ;;
                artifacts/windows-latest-x64-artifacts/*) arch=x64 ;;
                *) continue ;;
              esac
              filename="OpenFrp-CrossPlatformLauncher_${GITHUB_REF_NAME#v}_${arch}_portable.exe"
            fi
            echo "处理文件: $filename"
            cp "$file" "release_files/$filename"
            
            # 为AppImage文件添加可执行权限
            if [[ "$filename" == *.AppImage ]]; then
              chmod +x "release_files/$filename"
            fi
          done
          
          # 上传所有文件到GitHub Release
          cd release_files
          for file in *; do
            if [ -f "$file" ]; then
              echo "上传 $file 到 GitHub Release"
              gh release upload "$GITHUB_REF_NAME" "$file" --clobber
            fi
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and publish the updater manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          manifest_dir=$(mktemp -d)
          gh release download "$GITHUB_REF_NAME" --pattern latest.json --dir "$manifest_dir"
          jq --exit-status --arg version "${GITHUB_REF_NAME#v}" '
            (.version | ltrimstr("v")) == $version
            and (.platforms as $platforms |
              ["windows-x86_64", "windows-aarch64", "linux-x86_64", "darwin-x86_64", "darwin-aarch64"] |
              all(. as $target |
                ($platforms[$target].signature | type == "string" and length > 0)
                and ($platforms[$target].url | type == "string" and startswith("https://"))
              )
            )
          ' "$manifest_dir/latest.json"
          cp "$manifest_dir/latest.json" "$manifest_dir/update.json"
          gh release upload "$GITHUB_REF_NAME" "$manifest_dir/update.json" --clobber
