[[permission]]
identifier = "allow-launcher-commands"
description = "Allow the main launcher webview to use the application commands."
commands.allow = [
  "download_frpc",
  "start_frpc_instance",
  "stop_frpc_instance",
  "check_frpc_status",
  "list_frpc_instances",
  "check_frpc",
  "get_frpc_file",
  "get_frpc_cli_version",
  "kill_all_processes",
  "exit_app",
  "take_startup_links",
  "take_autostart_restore",
  "get_quick_start_enabled",
  "set_quick_start_enabled",
  "begin_local_oauth_login",
  "start_local_oauth_server",
  "cancel_local_oauth_server",
  "oauth_callback",
  "get_cpl_version",
  "toggle_auto_start",
  "check_auto_start",
  "debug_auto_start",
  "set_env",
  "get_env",
  "check_proxy_bypass",
  "probe_url",
  "get_announcement",
  "proxy_api",
  "get_app_data_dir",
  "open_app_data_dir",
  "get_local_ports",
  "check_update",
  "download_and_install_update",
  "get_system_info",
  "get_detailed_system_info",
  "get_build_info",
  "tcp_ping",
  "argo_request_login",
  "argo_wait_authorization",
  "argo_cancel_wait",
]
